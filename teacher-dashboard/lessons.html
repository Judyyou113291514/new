<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>課程與備課 · 新手老師成長儀表板</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="layout" class="layout">

  <div class="page-head">
    <h1>課程與備課</h1>
    <p class="page-desc">一份備課單＝一個班的一個單元。重點不是寫得漂亮，而是把「器材」「預期卡點」「備案」先想過一次。</p>
  </div>

  <div class="row mb-4">
    <button class="btn btn-primary" id="newLessonBtn" type="button">新增備課單</button>
    <select id="filterClass" aria-label="依班級篩選" style="max-width:180px"></select>
    <span class="grow"></span>
    <span class="small muted" id="lessonStats"></span>
  </div>

  <div id="lessonList" class="stack"></div>

</div>

<!-- 列印教案用的容器（平常隱藏，按「列印教案」才顯示） -->
<div id="printArea" aria-hidden="true"></div>

<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/lessons.js"></script>
</body>
</html>
